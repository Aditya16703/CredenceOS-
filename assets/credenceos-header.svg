<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="160" r="140" fill="url(#glowGrad)"/>
  <circle cx="1050" cy="80" r="180" fill="url(#glowGrad)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#primaryGrad)"/>

  <!-- ================= LOGO EMBLEM (Left) ================= -->
  <g transform="translate(70, 75)" filter="url(#shadow)">
    <!-- Outer Glow & Shield -->
    <rect x="0" y="0" width="170" height="170" rx="36" fill="#0B132B" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="8" y="8" width="154" height="154" rx="28" fill="url(#accentGrad)" fill-opacity="0.15"/>

    <!-- Institutional Temple / Bank Vector Art -->
    <!-- Pediment Roof (Triangle) -->
    <path d="M 85 34 L 138 60 L 32 60 Z" fill="url(#primaryGrad)"/>
    <!-- Pediment Cornice -->
    <rect x="28" y="60" width="114" height="7" rx="2" fill="#E2E8F0"/>
    <!-- Capital Architrave -->
    <rect x="34" y="67" width="102" height="5" rx="1" fill="#94A3B8"/>

    <!-- 4 Ionic Columns -->
    <g fill="url(#primaryGrad)">
      <!-- Column 1 -->
      <rect x="40" y="74" width="12" height="46" rx="2"/>
      <!-- Column 2 -->
      <rect x="65" y="74" width="12" height="46" rx="2"/>
      <!-- Column 3 -->
      <rect x="93" y="74" width="12" height="46" rx="2"/>
      <!-- Column 4 -->
      <rect x="118" y="74" width="12" height="46" rx="2"/>
    </g>

    <!-- Plinth / Base Steps -->
    <rect x="32" y="122" width="106" height="6" rx="1.5" fill="#94A3B8"/>
    <rect x="26" y="130" width="118" height="8" rx="2" fill="#E2E8F0"/>

    <!-- Central Security / Idempotency Key Lock Insignia -->
    <circle cx="85" cy="97" r="11" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 82 95 L 88 95 L 88 102 L 82 102 Z" fill="#38BDF8"/>
    <path d="M 83 95 A 2 2 0 0 1 87 95" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
  </g>

  <!-- ================= BRAND TYPOGRAPHY & HEADER ================= -->
  <g transform="translate(280, 80)">
    <!-- Top Meta Tag -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="230" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="12" cy="13" r="4" fill="#10B981"/>
      <text x="24" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1">INSTITUTIONAL FINTECH CORE</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 72)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
        Credence<tspan fill="url(#primaryGrad)">OS</tspan>
      </text>
      <!-- Sub-badge -->
      <g transform="translate(340, -38)">
        <rect x="0" y="0" width="85" height="24" rx="6" fill="rgba(37, 99, 235, 0.25)" stroke="#3B82F6" stroke-width="1"/>
        <text x="42.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#60A5FA" text-anchor="middle" letter-spacing="0.5">v2.4 LTS</text>
      </g>
    </g>

    <!-- Tagline -->
    <text x="2" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      Enterprise NBFC Lending &amp; Debt Recovery Management Platform
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 126)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="190" height="28" rx="6" fill="#0B132B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">⚡ Automated DTI Underwriting</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(202, 0)">
        <rect x="0" y="0" width="205" height="28" rx="6" fill="#0B132B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">📈 Reducing-Balance Amortization</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(419, 0)">
        <rect x="0" y="0" width="175" height="28" rx="6" fill="#0B132B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">🔒 Payment Idempotency</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(606, 0)">
        <rect x="0" y="0" width="145" height="28" rx="6" fill="#0B132B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">📜 KYC Audit Trail</text>
      </g>
    </g>
  </g>

  <!-- Decorative Wave Geometry (Bottom Right) -->
  <path d="M 850 320 C 950 250, 1050 290, 1200 240 L 1200 320 Z" fill="url(#primaryGrad)" fill-opacity="0.12"/>
  <path d="M 920 320 C 1020 270, 1100 300, 1200 270 L 1200 320 Z" fill="url(#accentGrad)" fill-opacity="0.2"/>
</svg>
