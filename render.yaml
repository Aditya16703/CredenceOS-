services:
  # Backend API Service
  - type: web
    name: credence-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://credence-frontend.onrender.com
    autoDeploy: true
    rootDir: .

  # Frontend Service
  - type: web
    name: credence-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://credence-backend.onrender.com
    autoDeploy: true
    rootDir: .
